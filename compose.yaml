services:
  journey:
    build: .
    image: journey-anita:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_PATH: /app/data/journey.db
    ports:
      - "127.0.0.1:13240:3000"
    volumes:
      - journey_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  journey_data:
